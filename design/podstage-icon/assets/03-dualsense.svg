<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile3" x1="128" y1="8" x2="128" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile3)"/>
  <!-- one flat capsule: the DualSense read without the grip lobes -->
  <rect x="34" y="82" width="188" height="116" rx="52" fill="#eef2fa"/>
  <!-- light bar -->
  <rect x="106" y="100" width="44" height="9" rx="4.5" fill="#a9b6ff"/>
  <!-- d-pad top left -->
  <g fill="#0e1118">
    <rect x="58" y="120" width="44" height="14" rx="4"/>
    <rect x="73" y="105" width="14" height="44" rx="4"/>
  </g>
  <!-- face buttons top right, symmetric diamond -->
  <g fill="#7c8cf8">
    <circle cx="172" cy="106" r="7"/>
    <circle cx="190" cy="127" r="7"/>
    <circle cx="172" cy="148" r="7"/>
    <circle cx="154" cy="127" r="7"/>
  </g>
  <!-- both sticks low and centred: the PlayStation read -->
  <g fill="#0e1118">
    <circle cx="92" cy="164" r="19"/>
    <circle cx="164" cy="164" r="19"/>
  </g>
  <g fill="none" stroke="#7c8cf8" stroke-width="4">
    <circle cx="92" cy="164" r="19"/>
    <circle cx="164" cy="164" r="19"/>
  </g>
</svg>
